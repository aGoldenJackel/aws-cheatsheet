<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

  <defs>

    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93e5ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Flask inner shape -->
    <clipPath id="flaskClip">
      <path d="
        M220 180
        L165 320
        Q155 350 190 350
        L322 350
        Q357 350 347 320
        L292 180
        Z"/>
    </clipPath>

  </defs>

  <!-- Blue Phantom Hexagon -->
  <polygon
    points="256,24 462,142 462,370 256,488 50,370 50,142"
    fill="#2563eb"/>

  <!-- Water clipped perfectly inside flask -->
  <g clip-path="url(#flaskClip)">
    <path d="
      M140 260
      Q190 235 256 260
      Q322 285 372 260

      L372 380
      L140 380
      Z"
      fill="url(#water)"/>
  </g>

  <!-- Flask outline -->
  <g fill="none"
     stroke="#ffffff"
     stroke-width="12"
     stroke-linecap="round"
     stroke-linejoin="round">

    <line x1="220" y1="110" x2="220" y2="180"/>
    <line x1="292" y1="110" x2="292" y2="180"/>
    <line x1="220" y1="110" x2="292" y2="110"/>

    <path d="
      M220 180
      L165 320
      Q155 350 190 350
      L322 350
      Q357 350 347 320
      L292 180
      Z"/>
  </g>

  <!-- Bubbles -->
  <circle cx="220" cy="245" r="8" fill="#ffffff"/>
  <circle cx="295" cy="235" r="6" fill="#ffffff"/>
  <circle cx="260" cy="220" r="5" fill="#ffffff"/>

  <!-- AWS -->
  <text
    x="256"
    y="305"
    text-anchor="middle"
    fill="#ffffff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="30"
    font-weight="900">
    AWS
  </text>

</svg>
