
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Work in Progress</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700;900&display=swap');

:root {
  --ink:#585858;
  --purple:#7654d6;
}

* {box-sizing:border-box}

body {
  margin:0;
  background:#fff;
  color:var(--ink);
  font-family:'Source Sans Pro',Arial,sans-serif;
  min-height:100vh;
}

.container {
  max-width:1120px;
  margin:auto;
  padding:55px 35px 40px;
}

.hero {
  text-align:center;
  max-width:800px;
  margin:35px auto 0;
}

.eyebrow {
  font-size:12px;
  letter-spacing:3px;
  font-weight:700;
  margin-bottom:18px;
}

h1 {
  font-size:clamp(48px,8vw,85px);
  line-height:1;
  letter-spacing:-3px;
  font-weight:900;
  margin:0 0 20px;
}

h1 span {color:var(--purple)}

.gif-container {
  margin:45px auto;
  max-width:520px;
  min-height:250px;
  background:#f5f3fb;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  overflow:hidden;
}

.gif-container img {
  display:block;
  width:100%;
  max-height:350px;
  object-fit:contain;
}

.gif-placeholder {
  color:#999;
  font-size:14px;
  text-align:center;
  letter-spacing:1px;
}

.message {
  font-size:25px;
  font-weight:700;
  margin:25px 0 35px;
}

button {
  font:inherit;
  cursor:pointer;
  background:var(--ink);
  color:white;
  border:0;
  padding:15px 30px;
  font-size:14px;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
  transition:.2s;
}

button:hover {
  background:var(--purple);
  transform:translateY(-3px);
}

@media(max-width:650px) {
  .container {padding:30px 18px}
  .hero {margin-top:45px}
  h1 {font-size:55px}
  .gif-container {
    min-height:180px;
    margin:30px auto;
  }
  .message {font-size:21px}
}
</style>
</head>

<body>
<div class="container">

<main class="hero">

  <div class="eyebrow">CURRENT STATUS · UNDER DEVELOPMENT</div>

  <h1>Work in<br>Progress<span>.</span></h1>

  <div class="gif-container">
    <img
      src="coal-miner.gif"
      alt="Coal miner working"
      onerror="this.style.display='none';document.getElementById('gif-placeholder').style.display='block';"
    >

    <div class="gif-placeholder" id="gif-placeholder" style="display:none">
      YOUR GIF WILL APPEAR HERE
    </div>
  </div>

  <div class="message">We're digging into something new.</div>

  <button onclick="history.back()">
    ← Go back
  </button>

</main>

</div>
</body>
</html>
