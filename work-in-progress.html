
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="images/images/main_logo.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work in Progress</title>

<style>
html, body, div, main, h1, p, a {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px;
    background: #ffffff;
    color: #202124;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 100%;
    max-width: 850px;
    text-align: center;
}

.status {
    color: #7654d6;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 20px;
}

h1 {
    font-size: 65px;
    font-weight: bold;
    margin: 0 0 35px 0;
}

.message {
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 12px;
}

.submessage {
    color: #777777;
    font-size: 16px;
    margin-bottom: 35px;
}

.back-button {
    display: inline-block;
    background: #252525;
    color: #ffffff;
    text-decoration: none;
    padding: 13px 28px;
    border-radius: 7px;
    font-size: 15px;
    font-weight: bold;
}

.back-button:hover {
    background: #7654d6;
}

@media (max-width: 600px) {
    h1 {
        font-size: 42px;
    }

    .message {
        font-size: 19px;
    }
}
</style>
</head>

<body>

<main class="container">

    <div class="status">CURRENT STATUS - UNDER DEVELOPMENT</div>

    <h1>Work in Progress.</h1>

    <p class="message">We're digging into something new.</p>

    <p class="submessage">
        Something new is on its way. Check back soon.
    </p>

    <a href="index.html" class="back-button">Back to Home</a>

</main>

</body>
</html>
