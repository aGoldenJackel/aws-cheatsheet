<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work in Progress</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --background: #ffffff;
    --text: #202124;
    --muted: #777777;
    --purple: #7654d6;
}

 {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Source Sans 3', sans-serif;
    background: var(--background);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 20px;
}

.container {
    width: 100%;
    max-width: 850px;
    text-align: center;
}

.status {
    display: inline-block;
    color: var(--purple);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 20px;
}

h1 {
    font-size: clamp(42px, 8vw, 76px);
    font-weight: 800;
    letter-spacing: -2px;
    line-height: 1.05;
    margin-bottom: 35px;
}

.image-container {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0 auto 35px;
}

.image-container img {
    display: block;
    max-width: 100%;
    max-height: 380px;
    width: auto;
    height: auto;
    object-fit: contain;
}

.message {
    font-size: 21px;
    font-weight: 600;
    margin-bottom: 12px;
}

.submessage {
    color: var(--muted);
    font-size: 16px;
    margin-bottom: 35px;
}

.back-button {
    display: inline-block;
    padding: 13px 28px;
    background: #252525;
    color: white;
    text-decoration: none;
    border-radius: 7px;
    font-size: 15px;
    font-weight: 700;
    transition: background 0.2s ease;
}

.back-button:hover {
    background: var(--purple);
}

@media (max-width: 600px) {
    h1 {
        letter-spacing: -1px;
    }

    .image-container img {
        max-height: 280px;
    }

    .message {
        font-size: 19px;
    }
}
</style>
</head>

<body>

<main class="container">

    <div class="status">CURRENT STATUS · UNDER DEVELOPMENT</div>

    <h1>Work in Progress.</h1>

    <div class="image-container">
        <img src="your-image.png" alt="Work in Progress illustration">
    </div>

    <p class="message">We're digging into something new.</p>

    <p class="submessage">
        Something new is on its way. Check back soon.
    </p>

    <a href="index.html" class="back-button">Back to Home</a>

</main>

</body>
</html>
