<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 8 English — Revision Quiz</title>
<style>
:root{--bg:#0b1020;--panel:#141c2e;--panel2:#1a2540;--text:#e8edf7;--muted:#9aa9c2;--accent:#8b9cff;--accent2:#6578ef;--border:#2a3651;--good:#1f9d68;--bad:#d65060}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#172344 0,#0b1020 45%);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);min-height:100vh}
.wrap{max-width:1050px;margin:auto;padding:24px 16px 40px}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand h1{font-size:clamp(1.25rem,3vw,1.8rem);margin:0}.brand p{margin:4px 0 0;color:var(--muted)}
.timer{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:10px 16px;font-weight:800;font-variant-numeric:tabular-nums}.timer.warning{color:#ffbd69;border-color:#ffbd69}
.card{background:rgba(20,28,46,.94);border:1px solid var(--border);border-radius:20px;padding:clamp(16px,3vw,26px);box-shadow:0 16px 50px #0003}
.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--muted);font-size:.9rem}.progress{height:8px;background:#27334d;border-radius:99px;overflow:hidden;margin:12px 0 24px}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),#a9b4ff);transition:width .2s}
.question{font-size:clamp(1.1rem,2.6vw,1.4rem);font-weight:700;line-height:1.4;margin:0 0 18px}.choices{display:grid;gap:10px}.choice{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;padding:14px;border-radius:13px;border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer;font:inherit;transition:.15s}.choice:hover{border-color:var(--accent);transform:translateY(-1px)}.letter{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:#2b3858;font-weight:800}.choice.selected{border-color:var(--accent);background:#27345a}.choice.correct{border-color:var(--good);background:#123c30}.choice.incorrect{border-color:var(--bad);background:#48252e}.choice:disabled{cursor:default;transform:none}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}.btn{border:1px solid var(--border);background:#263451;color:var(--text);padding:11px 17px;border-radius:11px;font-weight:700;cursor:pointer}.btn:hover{filter:brightness(1.15)}.btn.primary{background:var(--accent2);border-color:var(--accent2)}.btn:disabled{opacity:.45;cursor:not-allowed}
.navigator{margin-top:18px}.navigator h3{margin:0 0 10px;font-size:1rem}.numbers{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:7px}.num{aspect-ratio:1;border:1px solid var(--border);border-radius:9px;background:#19243a;color:var(--muted);cursor:pointer;font-weight:700}.num.current{outline:2px solid var(--accent);color:white}.num.answered{background:#344568;color:white}.num.correct{background:#17563c;color:white}.num.wrong{background:#642d39;color:white}
.result{display:none}.result h2{margin-top:0;font-size:1.7rem}.scorebig{font-size:2.5rem;font-weight:900;color:#a9b4ff}.review{display:grid;gap:12px;margin-top:22px}.reviewitem{padding:15px;border:1px solid var(--border);border-radius:13px;background:#111a2b}.reviewitem.correct{border-left:5px solid var(--good)}.reviewitem.wrong{border-left:5px solid var(--bad)}.reviewitem p{margin:7px 0}.small{color:var(--muted);font-size:.92rem}
@media(max-width:540px){.numbers{grid-template-columns:repeat(6,minmax(0,1fr))}.navrow .btn{flex:1}.topline{font-size:.82rem}}
</style>
</head>
<body>
<div class="wrap">
<header class="header"><div class="brand"><h1>Grade 8 English Revision Quiz</h1><p>30 questions · randomized · 30-minute timer</p></div><div class="timer" id="timer">30:00</div></header>
<section class="card" id="quiz">
<div class="topline"><span id="qcount">Question 1 of 30</span><span id="category"></span></div>
<div class="progress"><span id="progress"></span></div>
<h2 class="question" id="question"></h2>
<div class="choices" id="choices"></div>
<div class="navrow"><button class="btn" id="prev">← Previous</button><button class="btn primary" id="next">Next →</button><button class="btn primary" id="submit" style="display:none">Submit Quiz</button></div>
<div class="navigator"><h3>Question Navigator</h3><div class="numbers" id="numbers"></div></div>
</section>
<section class="card result" id="result"></section>
</div>
<script>
const raw = [["Gaming Communities", "Which is a positive effect of gaming communities?", ["Gaming can help people communicate more clearly with others.   ", "Gaming can encourage people to avoid communicating with others.", "Gaming can make it harder for people to build friendships.     ", "Gaming can lead people to use technology less confidently.     "], 0], ["Gaming Communities", "Gaming communities can help people by allowing them to…", ["avoid meeting or communicating with people in online spaces. ", "make friends with people who share similar interests.        ", "stop developing skills that are useful when using technology.", "spend time online without interacting with other players.    "], 1], ["Gaming Communities", "What is digital literacy?", ["Being able to understand and use digital tools effectively.     ", "Being able to win games without communicating with teammates.   ", "Being able to read printed information without using technology.", "Being able to avoid online information and digital devices.     "], 0], ["Gaming Communities", "Which is an example of toxic online behaviour?", ["Offering helpful advice when another player makes a mistake.  ", "Welcoming a new player and encouraging them to participate.   ", "Using trolling to upset or deliberately bother another player.", "Sharing useful information with teammates during a game.      "], 2], ["Argument Writing & Logical Fallacies", "In argument writing, what is a claim?", ["The position or opinion that the writer wants to support.     ", "A fact or example that explains why the evidence is useful.   ", "A sentence that repeats information without taking a position.", "A personal comment that criticizes someone who disagrees.     "], 0], ["Argument Writing & Logical Fallacies", "What does evidence do in an argument?", ["It introduces an unrelated topic to distract the reader.       ", "It provides facts or examples that support the writer's claim. ", "It attacks the character of someone with a different opinion.  ", "It repeats the claim without giving the reader further support."], 1], ["Argument Writing & Logical Fallacies", "Which fallacy argues that something is right because many people believe it?", ["Ad Hominem, because it attacks the person making the argument.             ", "Straw Man, because it changes an opposing argument unfairly.               ", "Bandwagon, because it treats popularity as proof that something is right.  ", "Hasty Generalization, because it makes a broad claim from limited examples."], 2], ["Argument Writing & Logical Fallacies", "Which fallacy attacks a person instead of their argument?", ["Bandwagon, because it uses popularity to support a position.                   ", "Ad Hominem, because it criticizes the person rather than the argument.         ", "Straw Man, because it changes an opposing argument into a weaker one.          ", "Hasty Generalization, because it reaches a conclusion from too little evidence."], 1], ["The Lucky Coin", "Who are the main characters in The Lucky Coin?", ["Maggie and her grandfather, who discuss the meaning of luck.          ", "Noor and her partner, who investigate a mysterious clue together.     ", "The narrator and the old man, whose story is told in the first person.", "A captain and the players, who try to protect an undefeated record.   "], 0], ["The Lucky Coin", "What is a central theme of The Lucky Coin?", ["People should depend on lucky objects whenever they face a challenge.        ", "People should trust themselves rather than depend on luck or superstition.   ", "People should believe that success is decided before they make an effort.    ", "People should avoid difficult choices because confidence cannot be developed."], 1], ["The Lucky Coin", "What does the word 'undefeated' mean?", ["A person or team that has never lost a competition or match.   ", "A person or team that has recently started playing a new sport.", "A person or team that depends on luck to achieve every victory.", "A person or team that has decided to stop competing in matches."], 0], ["The Lucky Coin", "In the story vocabulary, what does 'confidence' mean?", ["The belief that a lucky object will control the result of an event.", "The feeling of being unsure about making an important decision.    ", "The belief in your own abilities and your ability to succeed.      ", "The excitement someone feels after hearing unexpected news.        "], 2], ["Mystery Vocabulary", "What is the main responsibility of a detective?", ["To lead a sports team and organize its training sessions.  ", "To investigate clues and work out answers to mysteries.    ", "To create suspense by keeping important information hidden.", "To make guesses about events without looking for evidence. "], 1], ["Mystery Vocabulary", "What does the word 'justice' mean?", ["The feeling of excitement that comes from an unexpected event.    ", "The quality of being strange, unusual, or difficult to understand.", "The idea of treating people fairly and doing what is right.       ", "The feeling of suspense that builds during a mystery story.       "], 2], ["Mystery Vocabulary", "What does the word 'tension' mean in a mystery?", ["The suspense or nervous feeling that makes readers wonder what will happen.", "The fairness shown when people receive the treatment they deserve.         ", "The excitement someone feels when something enjoyable takes place.         ", "The wisdom used when someone makes a thoughtful decision.                  "], 0], ["The Tell-Tale Heart", "What happens first in the sequence of events in The Tell-Tale Heart?", ["The narrator hears a heartbeat and becomes increasingly disturbed.     ", "The narrator confesses after becoming overwhelmed by feelings of guilt.", "The narrator secretly watches the old man before taking further action.", "The narrator kills the old man and attempts to hide what happened.     "], 2], ["The Tell-Tale Heart", "What happens after the narrator kills the old man?", ["The narrator hears what seems to be the sound of a heartbeat.     ", "The narrator decides to leave and forget everything that happened.", "The narrator meets Maggie and begins talking about a lucky coin.  ", "The narrator immediately explains the entire event to a detective."], 0], ["The Tell-Tale Heart", "What does the heartbeat symbolize in The Tell-Tale Heart?", ["The narrator's growing confidence after completing a difficult task.", "The narrator's belief that luck will protect them from consequences.", "The narrator's desire to discover the truth about the old man.      ", "The narrator's guilt, which becomes harder to ignore over time.     "], 3], ["The Tell-Tale Heart", "Why is the narrator considered an unreliable narrator?", ["The narrator describes events but gives no details about the old man.        ", "The narrator's thoughts and descriptions make the account difficult to trust.", "The narrator tells the story using facts confirmed by other characters.      ", "The narrator explains the events from the old man's point of view.           "], 1], ["The Tell-Tale Heart", "What mainly drives the narrator's actions in the story?", ["The narrator's wish to become a respected and successful detective.       ", "The narrator's hope of finding a valuable object belonging to the old man.", "The narrator's obsession, which influences the way the narrator behaves.  ", "The narrator's confidence that a lucky coin will bring good results.      "], 2], ["Appositives", "What is an appositive?", ["A verb phrase that explains when an action takes place in a sentence.", "A noun or noun phrase that renames or identifies another noun.       ", "A group of words that predicts what a character will do next.        ", "A pronoun that replaces every noun in a complete sentence.           "], 1], ["Appositives", "Which sentence correctly uses a nonessential appositive?", ["Noor a careful detective examined the clue beside the doorway.  ", "Noor, a careful detective, examined the clue beside the doorway.", "Noor examined, a careful detective the clue beside the doorway. ", "A careful detective Noor examined the clue beside the doorway.  "], 1], ["Appositives", "Which sentence contains an essential appositive that does not need commas?", ["My brother, Ali, is waiting outside the classroom after school.      ", "The poet Maya Angelou inspired readers through her writing and ideas.", "Noor, our detective, discovered an important clue near the door.     ", "The dog, a beagle, followed its owner along the quiet street.        "], 1], ["Participles & Participial Phrases", "Which word is an example of a present participle?", ["The word 'broken', because it is a past form used to describe something. ", "The word 'written', because it is a past form used to describe something.", "The word 'climbing', because it ends in -ing and can describe a noun.    ", "The word 'spoken', because it is a past form used to describe something. "], 2], ["Participles & Participial Phrases", "Which word is an example of a past participle?", ["The word 'running', because it ends in -ing and can describe a noun.    ", "The word 'trying', because it ends in -ing and can describe a noun.     ", "The word 'climbing', because it ends in -ing and can describe a noun.   ", "The word 'broken', because it is a past participle used as an adjective."], 3], ["Participles & Participial Phrases", "What is a participial phrase?", ["A phrase beginning with a participle that describes a noun in the sentence.", "A phrase containing a claim and evidence to support an argument.           ", "A noun phrase that renames another noun and is set off with commas.        ", "A sentence that makes an educated guess about what may happen next.        "], 0], ["Indefinite Pronouns", "Which of the following indefinite pronouns is singular?", ["The pronoun 'several', which refers to more than one person or thing.      ", "The pronoun 'both', which refers to two people or things together.         ", "The pronoun 'everyone', which refers to all people in a group individually.", "The pronoun 'few', which refers to a small number of people or things.     "], 2], ["Indefinite Pronouns", "Which sentence uses an indefinite pronoun with the correct verb?", ["Everyone are ready to begin the activity after the instructions.   ", "Several is waiting outside the classroom for the teacher to arrive.", "Each are finished with the questions in the revision worksheet.    ", "Everyone is ready to begin the activity after the instructions.    "], 3], ["Predictions", "What is a prediction when reading a story?", ["A fact about an event that has already happened in the story.       ", "An educated guess about what may happen next, based on clues.       ", "A random idea about the ending that does not use any clues.         ", "A character's nickname, which helps readers identify that character."], 1], ["Predictions", "What should a reader do when new evidence does not support a prediction?", ["Ignore the new evidence and keep the original prediction unchanged.", "Stop reading because the original prediction was not correct.      ", "Revise the prediction so it reflects the new evidence in the text. ", "Choose another prediction without checking any clues in the story. "], 2]];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const questions=shuffle(raw.map(q=>{let choices=q[2].map((t,i)=>({t,correct:i===q[3]}));shuffle(choices);return {cat:q[0],text:q[1],choices,answer:choices.findIndex(c=>c.correct)};}));
let index=0,answers=Array(questions.length).fill(null),submitted=false,remaining=1800;
const $=id=>document.getElementById(id);
function render(){const q=questions[index];$('qcount').textContent=`Question ${index+1} of ${questions.length}`;$('category').textContent=q.cat;$('progress').style.width=((index+1)/questions.length*100)+'%';$('question').textContent=q.text;$('choices').innerHTML='';
q.choices.forEach((c,i)=>{let b=document.createElement('button');b.className='choice';if(answers[index]===i)b.classList.add('selected');if(submitted){b.disabled=true;if(c.correct)b.classList.add('correct');else if(answers[index]===i)b.classList.add('incorrect');}
b.innerHTML=`<span class="letter">${'ABCD'[i]}</span><span></span>`;b.querySelector('span:last-child').textContent=c.t;b.onclick=()=>{if(!submitted){answers[index]=i;render();}};$('choices').appendChild(b);});
$('prev').disabled=index===0;$('next').style.display=index===questions.length-1?'none':'inline-block';$('submit').style.display=index===questions.length-1&&!submitted?'inline-block':'none';if(submitted){$('next').style.display='none';$('submit').style.display='none';}
renderNums();}
function renderNums(){const box=$('numbers');box.innerHTML='';questions.forEach((q,i)=>{let b=document.createElement('button');b.className='num';b.textContent=i+1;if(i===index)b.classList.add('current');if(answers[i]!==null)b.classList.add('answered');if(submitted)b.classList.add(answers[i]===q.answer?'correct':'wrong');b.onclick=()=>{index=i;render();};box.appendChild(b);});}
$('prev').onclick=()=>{if(index>0){index--;render();}};$('next').onclick=()=>{if(index<questions.length-1){index++;render();}};$('submit').onclick=submitQuiz;
function submitQuiz(){if(submitted)return;submitted=true;render();let score=questions.reduce((s,q,i)=>s+(answers[i]===q.answer?1:0),0);$('quiz').style.display='none';let r=$('result');r.style.display='block';r.innerHTML=`<h2>Quiz Results</h2><div class="scorebig">${score} / ${questions.length}</div><p><strong>${Math.round(score/questions.length*100)}%</strong> — ${score===30?'Perfect score!':score>=24?'Great work!':score>=18?'Good effort—review missed questions.':'Keep studying and try again.'}</p><p class="small">Time used: ${formatTime(1800-remaining)} · Correct answers are green; your incorrect choices are red.</p><div class="review"></div><button class="btn primary" onclick="location.reload()">Try a New Random Quiz</button>`;
let review=r.querySelector('.review');questions.forEach((q,i)=>{let correct=answers[i]===q.answer;let d=document.createElement('div');d.className='reviewitem '+(correct?'correct':'wrong');d.innerHTML=`<strong>${i+1}. ${q.cat}</strong><p>${q.text}</p><p>Your answer: ${answers[i]===null?'Not answered':q.choices[answers[i]].t}</p><p><strong>Correct answer: ${q.choices[q.answer].t}</strong></p>`;review.appendChild(d);});}
function formatTime(s){let m=Math.floor(s/60),sec=s%60;return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;}
function tick(){if(submitted)return;remaining--;$('timer').textContent=formatTime(remaining);if(remaining<=300)$('timer').classList.add('warning');if(remaining<=0){submitQuiz();} }
setInterval(tick,1000);render();
</script>
</body>
</html>
